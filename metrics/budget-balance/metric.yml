# Definition file for one metric. Everything the page shows, other than the numbers
# in data.csv, comes from this file. See metrics/README.md for what each field does.
# Words in braces, such as {real_base}, are filled in from the data when the page is built.
slug: budget-balance
title: Budget balance
theme: Budget and debt
jurisdiction: Commonwealth
description: "Whether the Commonwealth budget was in surplus or deficit each year since 1970-71, measured by the underlying cash balance."
lede: "The Commonwealth's underlying cash balance each financial year since {first_period}: a surplus when receipts exceed payments, a deficit when they fall short. Shown as a share of the economy, in dollars of the day and in {real_base} dollars."

draft: false
draft_banner: "Draft, not for publication. The figures are read from the Treasury file by code and have not yet had the check the plan requires."

# Each series needs a frequency (annual) and a plausible range. The validator (npm run validate)
# stops the build if a year is missing or a value falls outside the range. Each series also needs
# a "revision" tolerance: how far an already accepted figure may change before the checker blocks it
# until the owner accepts it (see metrics/README.md). Negative figures are deficits; the sign is kept as published.
series:
  - id: ucb
    label: Underlying cash balance
    definition: Cash received less cash paid out by the Australian Government general government sector in the financial year, leaving out the earnings of the Future Fund. Positive is a surplus, negative a deficit.
    source_table: Final Budget Outcome, Appendix B, Table B.1, "Underlying cash balance", $m
    frequency: annual
    plausible: {min: -300000, max: 100000}
    # Revision tolerance: Treasury's September 2026 revision changed no dollar figure of the underlying cash balance, so any
    # change of more than $1m to an accepted dollar figure blocks until the owner accepts it.
    # This catches transposed or dropped digits. Write it on one line: the weekly report reads it without a YAML library.
    revision: {max_abs: 1}
  - id: ucb_pct_gdp
    label: Underlying cash balance, share of GDP
    source_table: Final Budget Outcome, Appendix B, Table B.1, "Underlying cash balance", per cent of GDP
    frequency: annual
    plausible: {min: -15, max: 10}
    # Revision tolerance: Treasury's September 2026 revision moved one share of the underlying cash balance by 0.1 point
    # (2017-18), so up to 0.5 passes with a warning and more blocks. Write it on one line: the weekly report reads it without a YAML library.
    revision: {max_abs: 0.5}

# The headline figures above the chart. Values are read from data.csv.
tiles:
  - label: Underlying cash balance
    series: ucb
    sub_period: true
  - label: As a share of GDP
    series: ucb_pct_gdp
    sub_period: true
  - label: Target status
    text: No numeric target
    sub_text: See the fiscal strategy below

# The chart. The first view is shown first. zero_line: true draws a clear line at zero on the view.
# derive: none uses data.csv as it is. derive: real multiplies each value by
# (CPI of the latest June in the data / CPI of that row's June), using shared/cpi_june.csv.
# Rows with no CPI figure are left out of that view.
views:
  - id: share_of_gdp
    label: Share of GDP
    derive: none
    zero_line: true
    lines:
      - series: ucb_pct_gdp
        label: Underlying cash balance
    caption: Per cent of GDP. Above zero is a surplus, below zero a deficit.
  - id: nominal
    label: Dollars of the day
    derive: none
    zero_line: true
    lines:
      - series: ucb
        label: Underlying cash balance
    caption: Dollars of the day. Above zero is a surplus, below zero a deficit.
  - id: real
    label: "{real_base} prices"
    derive: real
    zero_line: true
    lines:
      - series: ucb
        label: Underlying cash balance
    caption: "In {real_base} dollars, adjusted with the Consumer Price Index. Above zero is a surplus, below zero a deficit."
chart_alt: "Line chart of the Commonwealth underlying cash balance, {first_year} to {last_year}, with a line at zero: above it a surplus, below it a deficit. The full figures are in the table below."
chart_source: "Source: Final Budget Outcome {latest_period}, Appendix B, Table B.1."

# The full table. Newest first. Format follows the series unit.
table:
  period_header: Year to 30 June
  columns:
    - header: Underlying cash balance $m
      series: ucb
    - header: "% GDP"
      series: ucb_pct_gdp
    - header: "{real_base} $m (worked out)"
      series: ucb
      derive: real

meaning:
  - "The **underlying cash balance** is the Commonwealth's main measure of the budget bottom line: cash received, mostly taxes, less cash paid out, in a financial year. A positive figure is a surplus and a negative figure a deficit."
  - "It leaves out the earnings of the Future Fund, which are set aside rather than spent, and some other items. Budget papers also publish a headline cash balance and accrual measures, which give different figures."

# Targets and forecasts ledger.
targets:
  - label: Target
    text: "No numeric target. The fiscal strategy in the 2026-27 Budget includes \"returning the budget to balance in a measured way, over time\", with no figure or date. {link}"
    link:
      label: "Budget 2026-27, Budget Paper No. 1, Statement 3"
      url: https://budget.gov.au/content/bp1/download/bp1_bs-3.pdf
  - label: Government projection
    text: "The 2026-27 Budget projects the underlying cash balance returning to balance in 2034-35. This is a projection, not a target. {link}"
    link:
      label: "Budget 2026-27, Budget Paper No. 1, Statement 3"
      url: https://budget.gov.au/content/bp1/download/bp1_bs-3.pdf

# Sources and method ledger. {link} is replaced by the link; {update} and {retrieved}
# by the fields below.
update: Annually, when the Final Budget Outcome is published (late September).
retrieved: 2026-11-25
sources_method:
  - label: Budget balance figures
    link:
      label: Final Budget Outcome 2025-26, Appendix B
      url: https://archive.budget.gov.au/2025-26/fbo/download/06_appendix_b.docx
    text: "{link}, Table B.1 (underlying cash balance, in $ million and as a share of GDP). The latest year is checked against the overview table in Part 1 of the same Final Budget Outcome. Treasury, September 2026."
  - label: Prices
    link:
      label: ABS
      url: https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/latest-release
    text: "June quarter Consumer Price Index, all groups, weighted average of eight capital cities, from the {link}. Real value = nominal × ({real_base_index} ÷ index for that June)."
  - label: Fiscal strategy and projection
    link:
      label: "2026-27 Budget Paper No. 1, Statement 3: Fiscal Strategy and Outlook"
      url: https://budget.gov.au/content/bp1/download/bp1_bs-3.pdf
    text: "{link}."
  - label: Updated
    text: "{update} Data retrieved {retrieved}."

read_with_care:
  - "Each point is a financial year ending 30 June. A new government inherits the budget year it takes office in: the 2022-23 surplus, for example, was in the budget year that began a few weeks after the May 2022 election."
  - "The underlying cash balance is affected by the economy as well as by government decisions. Tax receipts rise and payments fall in good times, and the reverse in downturns, as in the global financial crisis and COVID-19."
  - "Figures are on the current definition, back-cast by Treasury to 1970-71. Treasury revises past figures from time to time; a revised past figure is checked before it is accepted."
  - "This page shows the Commonwealth only. States and territories run their own budgets."
  - "Government shading starts on the day each government was sworn in. Recessions and crises are marked on every chart on this site using the same list. The marks give context and do not assign cause."

corrections_text: None yet. Every correction to this page will be listed here with its date and what changed.

# Fields kept from the worked-example definition file.
real_method: "nominal x (CPI {real_base} / CPI June of that year); June quarter, all groups, eight capitals"
target: none_found   # the fiscal strategy has no numeric target for the underlying cash balance
state_panel: false
inclusion_tests: {outcome: true, official: true, history: true, ongoing: true, no_editorial_choice: "the budget's headline measure, the underlying cash balance"}
